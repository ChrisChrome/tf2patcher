name: Build tf2patcher

on:
  push:
    branches:
      - main
      - master
      - current
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    strategy:
      matrix:
        target: [32, 64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2 toolchain
        uses: msys2/setup-msys2@v2.22.0
        with:
          msystem: ${{ matrix.target == 32 && 'MINGW32' || 'MINGW64' }}
          update: true
          install: |
            mingw-w64-i686-gcc
            mingw-w64-x86_64-gcc
            make

      - name: Build for ${{ matrix.target }}-bit
        shell: bash
        run: |
          make clean || true
          make TARGET=${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tf2patcher-${{ matrix.target }}bit
          path: |
            tf2patcher.exe
            *.dll
            *.dll.config
